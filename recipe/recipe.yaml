schema_version: 1

context:
  version: "2.0.1"

package:
  name: kache
  version: ${{ version }}

source:
  url: https://github.com/kunobi-ninja/kache/archive/refs/tags/v${{ version }}.tar.gz
  sha256: da9027c9b5afba0a34f80ded92509f2ece11011f8935e4e1c88a426ef7c1ace4

build:
  number: 0
  dynamic_linking:
    # Relocation would turn the absolute rpath added below into @loader_path.
    binary_relocation: ${{ not osx }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # Bypass libsqlite3-sys's bundled SQLite and link against conda-forge's SQLite.
      LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
    interpreter: brush
    content:
      # kache's build.rs links its build-script launcher with the link-args from
      # the rustflags and embeds the signed binary in kache. An absolute $PREFIX
      # rpath would end up inside it, and prefix replacement at install time
      # would invalidate its signature, so macOS kills every cached build script.
      - if: osx
        then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS//"$PREFIX/lib"/@loader_path/../lib}"
      - cargo auditable install --locked --no-track --bins --root "${LIBRARY_PREFIX:-$PREFIX}" --path .
      # kache hardlinks itself into each target directory to run cached build
      # scripts, where @loader_path/../lib doesn't reach libsqlite3. Give the
      # outer binary an absolute rpath too; prefix replacement keeps it valid.
      - if: osx
        then:
          - $INSTALL_NAME_TOOL -add_rpath "$PREFIX/lib" "$PREFIX/bin/kache"
          - codesign --force --sign - "$PREFIX/bin/kache"
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - brush
    - pkg-config
  host:
    - sqlite

tests:
  - package_contents:
      bin:
        - kache
  - script:
      - kache --help
  # kache runs a hardlinked copy of itself from each target directory.
  - if: osx
    then:
      script:
        - mkdir relocated
        - cp "$PREFIX/bin/kache" relocated/kache
        - relocated/kache --version

about:
  homepage: https://kunobi.ninja/docs/kache
  repository: https://github.com/kunobi-ninja/kache
  summary: Zero-copy, content-addressed build cache for Rust and C/C++.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - baszalmstra
    - haecker-felix
