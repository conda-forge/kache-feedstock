schema_version: 1

context:
  version: "2.1.1"

package:
  name: kache
  version: ${{ version }}

source:
  url: https://github.com/kunobi-ninja/kache/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4076d3537c52def4ac96f1fd59c5a8d19e3a904bb7ebcb72945777c09d04f96f

build:
  number: 0
  dynamic_linking:
    # Relocation would turn the absolute rpath added below into @loader_path.
    binary_relocation: ${{ not osx }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # Bypass libsqlite3-sys's bundled SQLite and link against conda-forge's SQLite.
      LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
    interpreter: brush
    content:
      # kache's build.rs links its build-script launcher with the link-args from
      # the rustflags and embeds the signed binary in kache. An absolute $PREFIX
      # rpath would end up inside it, and prefix replacement at install time
      # would invalidate its signature, so macOS kills every cached build script.
      - if: osx
        then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS//"$PREFIX/lib"/@loader_path/../lib}"
      - cargo auditable install --locked --no-track --bins --root "${LIBRARY_PREFIX:-$PREFIX}" --path .
      # kache-engine is the binary linked against conda-forge's SQLite. kache
      # copies itself and the engine into each target directory, where
      # @loader_path/../lib doesn't reach libsqlite3, so give the engine an
      # absolute rpath; prefix replacement keeps it valid.
      - if: osx
        then:
          - $INSTALL_NAME_TOOL -add_rpath "$PREFIX/lib" "$PREFIX/bin/kache-engine"
          - codesign --force --sign - "$PREFIX/bin/kache-engine"
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - brush
    - pkg-config
  host:
    - sqlite

tests:
  - package_contents:
      bin:
        - kache
        - kache-engine
        - kache-cl
        - kache-clang-cl
  - script:
      - kache --help
  # kache runs a hardlinked copy of itself from each target directory and
  # requires kache-engine beside every frontend copy.
  - if: osx
    then:
      script:
        - mkdir relocated
        - cp "$PREFIX/bin/kache" "$PREFIX/bin/kache-engine" relocated/
        - relocated/kache --version

about:
  homepage: https://kunobi.ninja/docs/kache
  repository: https://github.com/kunobi-ninja/kache
  summary: Zero-copy, content-addressed build cache for Rust and C/C++.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - baszalmstra
    - haecker-felix
